<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" style="background: #FFFFFF;">

  <!-- Panel A - Placeholder -->
  <g transform="translate(20, 50)">
  <text x="0" y="4" font-size="24" font-weight="400" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">(a)</text>
  <image x="0" y="10" width="330" height="330" href="tfus_fmri_final_square_trimmed.png" preserveAspectRatio="xMidYMid meet"/>
</g>

  <!-- Panel B - Targeting & Anatomy -->
<g transform="translate(360, 50)">
  <text x="0" y="4" font-size="24" font-weight="400" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">(b)</text>
  <image x="0" y="10" width="330" height="330" href="sgacc_sagittal.png" preserveAspectRatio="xMidYMid meet"/>
</g>

  <!-- Panel C - Beampattern Placeholder -->
  <g transform="translate(700, 50)">
  <text x="0" y="4" font-size="24" font-weight="400" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">(c)</text>
  <image x="0" y="10" width="330" height="330" href="beampattern_2d.png" preserveAspectRatio="xMidYMid meet"/>
</g>
  
  <!-- Panel D - Session Timeline -->
  <g transform="translate(20, 410)">
    <text x="10" y="4" font-size="24" font-weight="400" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">(d)</text>
    <rect x="0" y="10" width="330" height="200" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="0.5" rx="4"/>
    
    <text x="150" y="35" font-size="22" text-anchor="middle" fill="#212121" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">Session Timeline</text>
    
    <rect x="20" y="55" width="100" height="60" fill="#9E9E9E" rx="3"/>
    <rect x="120" y="55" width="100" height="60" fill="#E65100" rx="3"/>
    <rect x="220" y="55" width="100" height="60" fill="#2E7D32" rx="3"/>
    
    <text x="70" y="90" font-size="24" text-anchor="middle" fill="white" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">Pre</text>
    <text x="170" y="90" font-size="24" text-anchor="middle" fill="white" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">tFUS</text>
    <text x="270" y="90" font-size="24" text-anchor="middle" fill="white" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">Post</text>
    
    <line x1="20"  y1="117" x2="20"  y2="127" stroke="#212121" stroke-width="1"/>
    <line x1="120" y1="117" x2="120" y2="127" stroke="#212121" stroke-width="1"/>
    <line x1="220" y1="117" x2="220" y2="127" stroke="#212121" stroke-width="1"/>
    <line x1="320" y1="117" x2="320" y2="127" stroke="#212121" stroke-width="1"/>
    
    <text x="20"  y="145" font-size="16" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">0</text>
    <text x="120" y="145" font-size="16" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">5</text>
    <text x="220" y="145" font-size="16" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">10</text>
    <text x="320" y="145" font-size="16" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">15</text>
    <text x="320" y="160" font-size="16" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">min</text>
    
    <text x="170" y="165" font-size="14" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">5 sonications</text>
    <rect x="120" y="172" width="16" height="26" fill="#E65100" opacity="0.9" rx="2"/>
    <rect x="140" y="172" width="16" height="26" fill="#E65100" opacity="0.9" rx="2"/>
    <rect x="160" y="172" width="16" height="26" fill="#E65100" opacity="0.9" rx="2"/>
    <rect x="180" y="172" width="16" height="26" fill="#E65100" opacity="0.9" rx="2"/>
    <rect x="200" y="172" width="16" height="26" fill="#E65100" opacity="0.9" rx="2"/>
    
    <!---<polygon points="138,180 144,184 138,188" fill="white"/>
    <polygon points="158,180 164,184 158,188" fill="white"/>
    <polygon points="178,180 184,184 178,188" fill="white"/>
    <polygon points="198,180 204,184 198,188" fill="white"/>
    <polygon points="218,180 224,184 218,188" fill="white"/>
    -->
    <!---
    <rect x="25" y="175" width="18" height="12" fill="#9E9E9E" rx="2"/>
    <text x="48" y="184" font-size="7" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">Baseline</text>
    
    <rect x="95" y="175" width="18" height="12" fill="#E65100" rx="2"/>
    <text x="118" y="184" font-size="7" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">Active/Sham</text>
    
    <rect x="180" y="175" width="18" height="12" fill="#2E7D32" rx="2"/>
    <text x="203" y="184" font-size="7" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">Recovery</text>
    -->
  </g>
  
  <!-- Panel E - Sonication Train Zoom -->
  <g transform="translate(360, 410)">
    <text x="0" y="4" font-size="24" font-weight="400" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">(e)</text>
    <rect x="0" y="10" width="330" height="200" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="0.5" rx="4"/>
    
    <text x="165" y="30" font-size="22" text-anchor="middle" fill="#212121" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">Sonication Protocol</text>
    
    <text x="165" y="52" font-size="16" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">1-minute detail (20s ON / 40s OFF)</text>
    
    <rect x="15" y="55" width="300" height="30" fill="#E0E0E0" rx="3"/>
    <rect x="15" y="55" width="100" height="30" fill="#E65100" rx="3"/>
    <text x="65" y="74" font-size="20" text-anchor="middle" fill="white" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">ON</text>
    <text x="215" y="74" font-size="20" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">OFF</text>
    
    <text x="15" y="98" font-size="14" text-anchor="start" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">0s</text>
    <text x="115" y="98" font-size="14" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">20s</text>
    <text x="315" y="98" font-size="14" text-anchor="end" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">60s</text>
    
    <text x="165" y="115" font-size="16" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">fo = 500 kHz, PRF = 40 Hz, duty = 30%</text>
    
    <rect x="15" y="122" width="300" height="40" fill="white" stroke="#E0E0E0" rx="3"/>
    
    <rect x="22" y="130" width="10" height="24" fill="#E65100"/>
    <rect x="55" y="130" width="10" height="24" fill="#E65100"/>
    <rect x="88" y="130" width="10" height="24" fill="#E65100"/>
    <rect x="121" y="130" width="10" height="24" fill="#E65100"/>
    <rect x="154" y="130" width="10" height="24" fill="#E65100"/>
    <rect x="187" y="130" width="10" height="24" fill="#E65100"/>
    <rect x="220" y="130" width="10" height="24" fill="#E65100"/>
    <rect x="253" y="130" width="10" height="24" fill="#E65100"/>
    
    <line x1="22" y1="168" x2="55" y2="168" stroke="#212121" stroke-width="0.5"/>
    <text x="38" y="178" font-size="12" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">25 ms</text>
    
    
    <rect x="15" y="182" width="300" height="26" fill="#FFF3E0" stroke="#E65100" stroke-width="0.5" rx="3"/>
    <text x="165" y="206" font-size="18" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">Ispta = 667 mW/cm<tspan baseline-shift="super">2</tspan></text>
  </g>
  
  <!-- Panel F - Analysis Pipeline -->
  <g transform="translate(700, 410)">
    <text x="0" y="4" font-size="24" font-weight="400" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">(f)</text>
    <rect x="0" y="10" width="330" height="200" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="0.5" rx="4"/>
    
    <text x="160" y="30" font-size="22" text-anchor="middle" fill="#212121" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">Analysis Pipeline</text>
    
    <!-- fMRIPrep -->
    <rect x="13" y="42" width="79" height="35" fill="#1976D2" rx="4"/>
    <text x="53" y="57" font-size="18" text-anchor="middle" fill="white" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">fMRIPrep</text>
    <text x="53" y="69" font-size="14" text-anchor="middle" fill="white" opacity="0.8" font-family="Helvetica Neue, Arial, sans-serif">Preprocess</text>
    
    <!-- Arrow 1 -->
    <line x1="95" y1="60" x2="115" y2="60" stroke="#212121" stroke-width="1.5"/>
    <polygon points="120,60 113,56 113,64" fill="#212121"/>
    
    <!-- sgACC Seed -->
    <rect x="125" y="42" width="75" height="35" fill="#7B1FA2" rx="4"/>
    <text x="162" y="57" font-size="18" text-anchor="middle" fill="white" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">sgACC</text>
    <text x="162" y="69" font-size="14" text-anchor="middle" fill="white" opacity="0.8" font-family="Helvetica Neue, Arial, sans-serif">Seed ROI</text>
    
    <!-- Arrow 2 -->
    <line x1="205" y1="60" x2="225" y2="60" stroke="#212121" stroke-width="1.5"/>
    <polygon points="230,60 223,56 223,64" fill="#212121"/>
    
    <!-- FC Computation -->
    <rect x="235" y="42" width="75" height="35" fill="#00695C" rx="4"/>
    <text x="272" y="57" font-size="18" text-anchor="middle" fill="white" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">FC</text>
    <text x="272" y="69" font-size="14" text-anchor="middle" fill="white" opacity="0.8" font-family="Helvetica Neue, Arial, sans-serif">Correlation</text>
    
    <!-- Arrow down from FC -->
    <line x1="272" y1="82" x2="272" y2="95" stroke="#212121" stroke-width="1.5"/>
    <line x1="272" y1="95" x2="160" y2="95" stroke="#212121" stroke-width="1.5"/>
    <line x1="160" y1="95" x2="160" y2="105" stroke="#212121" stroke-width="1.5"/>
    <polygon points="160,110 156,103 164,103" fill="#212121"/>
    
    <!-- Large FC computation block -->
    <rect x="20" y="115" width="280" height="45" fill="#455A64" rx="4"/>
    <text x="160" y="132" font-size="18" text-anchor="middle" fill="white" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">sgACC-centered FC</text>
    
    <!-- Three time windows -->
    <rect x="35" y="137" width="70" height="17" fill="#9E9E9E" rx="2"/>
    <text x="70" y="151" font-size="16" text-anchor="middle" fill="white" font-family="Helvetica Neue, Arial, sans-serif">Pre</text>
    
    <rect x="115" y="137" width="70" height="17" fill="#E65100" rx="2"/>
    <text x="150" y="151" font-size="16" text-anchor="middle" fill="white" font-family="Helvetica Neue, Arial, sans-serif">tFUS</text>
    
    <rect x="195" y="137" width="70" height="17" fill="#2E7D32" rx="2"/>
    <text x="230" y="151" font-size="16" text-anchor="middle" fill="white" font-family="Helvetica Neue, Arial, sans-serif">Post</text>
    
    <!-- Arrow to stats -->
    <line x1="160" y1="165" x2="160" y2="175" stroke="#212121" stroke-width="1.5"/>
    <polygon points="160,180 156,173 164,173" fill="#212121"/>
    
    <!-- Mixed Effects Model -->
    <rect x="18" y="183" width="285" height="22" fill="#37474F" rx="4"/>
    <text x="160" y="198" font-size="16" text-anchor="middle" fill="white" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">Mixed-Effects Model: time x condition</text>
  </g>
  

</svg>