<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" style="background: #FFFFFF;">

  <!-- Panel A - Placeholder -->
  <g transform="translate(20, 50)">
  <text x="0" y="0" font-size="14" font-weight="700" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">(a)</text>
  <image x="0" y="10" width="330" height="330" href="tfus_fmri_final_square_trimmed.png" preserveAspectRatio="xMidYMid meet"/>
</g>

  <!-- Panel B - Targeting & Anatomy -->
<g transform="translate(360, 50)">
  <text x="0" y="0" font-size="14" font-weight="700" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">(b)</text>
  <image x="0" y="10" width="330" height="330" href="sgacc_sagittal.png" preserveAspectRatio="xMidYMid meet"/>
</g>
  
  <!-- Panel C - Beampattern Placeholder -->
  <g transform="translate(700, 50)">
  <text x="0" y="0" font-size="14" font-weight="700" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">(c)</text>
  <image x="0" y="10" width="330" height="330" href="beampattern_2d.png" preserveAspectRatio="xMidYMid meet"/>
</g>
  
  <!-- Panel D - Session Timeline -->
  <g transform="translate(20, 410)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">(d)</text>
    <rect x="0" y="10" width="330" height="200" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="0.5" rx="4"/>
    
    <text x="150" y="35" font-size="11" text-anchor="middle" fill="#212121" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">Session Timeline (15 min)</text>
    
    <rect x="20" y="55" width="80" height="45" fill="#9E9E9E" rx="3"/>
    <rect x="100" y="55" width="80" height="45" fill="#E65100"/>
    <rect x="180" y="55" width="80" height="45" fill="#2E7D32" rx="3"/>
    
    <text x="60" y="83" font-size="12" text-anchor="middle" fill="white" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">Pre</text>
    <text x="140" y="83" font-size="12" text-anchor="middle" fill="white" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">tFUS</text>
    <text x="220" y="83" font-size="12" text-anchor="middle" fill="white" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">Post</text>
    
    <line x1="20" y1="100" x2="20" y2="108" stroke="#212121" stroke-width="1"/>
    <line x1="100" y1="100" x2="100" y2="108" stroke="#212121" stroke-width="1"/>
    <line x1="180" y1="100" x2="180" y2="108" stroke="#212121" stroke-width="1"/>
    <line x1="260" y1="100" x2="260" y2="108" stroke="#212121" stroke-width="1"/>
    
    <text x="20" y="120" font-size="8" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">0</text>
    <text x="100" y="120" font-size="8" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">5</text>
    <text x="180" y="120" font-size="8" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">10</text>
    <text x="260" y="120" font-size="8" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">15 min</text>
    
    <text x="140" y="135" font-size="7" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">5 sonications</text>
    <rect x="95" y="142" width="12" height="18" fill="#E65100" opacity="0.8" rx="2"/>
    <rect x="111" y="142" width="12" height="18" fill="#E65100" opacity="0.8" rx="2"/>
    <rect x="127" y="142" width="12" height="18" fill="#E65100" opacity="0.8" rx="2"/>
    <rect x="143" y="142" width="12" height="18" fill="#E65100" opacity="0.8" rx="2"/>
    <rect x="159" y="142" width="12" height="18" fill="#E65100" opacity="0.8" rx="2"/>
    
    <polygon points="99,147 105,151 99,155" fill="white"/>
    <polygon points="115,147 121,151 115,155" fill="white"/>
    <polygon points="131,147 137,151 131,155" fill="white"/>
    <polygon points="147,147 153,151 147,155" fill="white"/>
    <polygon points="163,147 169,151 163,155" fill="white"/>
    
    <!---
    <rect x="25" y="175" width="18" height="12" fill="#9E9E9E" rx="2"/>
    <text x="48" y="184" font-size="7" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">Baseline</text>
    
    <rect x="95" y="175" width="18" height="12" fill="#E65100" rx="2"/>
    <text x="118" y="184" font-size="7" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">Active/Sham</text>
    
    <rect x="180" y="175" width="18" height="12" fill="#2E7D32" rx="2"/>
    <text x="203" y="184" font-size="7" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">Recovery</text>
    -->
  </g>
  
  <!-- Panel E - Sonication Train Zoom -->
  <g transform="translate(340, 410)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">(e)</text>
    <rect x="0" y="10" width="300" height="200" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="0.5" rx="4"/>
    
    <text x="150" y="30" font-size="11" text-anchor="middle" fill="#212121" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">Sonication Protocol</text>
    
    <text x="150" y="48" font-size="8" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">1-minute detail (20s ON / 40s OFF)</text>
    
    <rect x="15" y="55" width="270" height="30" fill="#E0E0E0" rx="3"/>
    <rect x="15" y="55" width="90" height="30" fill="#E65100" rx="3"/>
    <text x="60" y="74" font-size="10" text-anchor="middle" fill="white" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">ON</text>
    <text x="195" y="74" font-size="10" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">OFF</text>
    
    <text x="15" y="98" font-size="7" text-anchor="start" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">0s</text>
    <text x="105" y="98" font-size="7" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">20s</text>
    <text x="285" y="98" font-size="7" text-anchor="end" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">60s</text>
    
    <text x="150" y="115" font-size="8" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">Pulsed waveform (PRF = 40 Hz, duty = 30%)</text>
    
    <rect x="15" y="122" width="270" height="40" fill="white" stroke="#E0E0E0" rx="3"/>
    
    <rect x="22" y="130" width="10" height="24" fill="#E65100"/>
    <rect x="55" y="130" width="10" height="24" fill="#E65100"/>
    <rect x="88" y="130" width="10" height="24" fill="#E65100"/>
    <rect x="121" y="130" width="10" height="24" fill="#E65100"/>
    <rect x="154" y="130" width="10" height="24" fill="#E65100"/>
    <rect x="187" y="130" width="10" height="24" fill="#E65100"/>
    <rect x="220" y="130" width="10" height="24" fill="#E65100"/>
    <rect x="253" y="130" width="10" height="24" fill="#E65100"/>
    
    <line x1="22" y1="168" x2="55" y2="168" stroke="#212121" stroke-width="0.5"/>
    <text x="38" y="178" font-size="6" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">25 ms period</text>
    
    <text x="250" y="145" font-size="7" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">500 kHz</text>
    
    <rect x="15" y="185" width="270" height="20" fill="#FFF3E0" stroke="#E65100" stroke-width="0.5" rx="3"/>
    <text x="150" y="199" font-size="9" text-anchor="middle" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">Ispta = 667 mW/cm2 (free-field, water tank)</text>
  </g>
  
  <!-- Panel F - Analysis Pipeline -->
  <g transform="translate(660, 410)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#212121" font-family="Helvetica Neue, Arial, sans-serif">(f)</text>
    <rect x="0" y="10" width="320" height="200" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="0.5" rx="4"/>
    
    <text x="160" y="30" font-size="11" text-anchor="middle" fill="#212121" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">Analysis Pipeline</text>
    
    <!-- fMRIPrep -->
    <rect x="15" y="42" width="75" height="35" fill="#1976D2" rx="4"/>
    <text x="52" y="57" font-size="9" text-anchor="middle" fill="white" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">fMRIPrep</text>
    <text x="52" y="69" font-size="7" text-anchor="middle" fill="white" opacity="0.8" font-family="Helvetica Neue, Arial, sans-serif">Preprocessing</text>
    
    <!-- Arrow 1 -->
    <line x1="95" y1="60" x2="115" y2="60" stroke="#212121" stroke-width="1.5"/>
    <polygon points="120,60 113,56 113,64" fill="#212121"/>
    
    <!-- sgACC Seed -->
    <rect x="125" y="42" width="75" height="35" fill="#7B1FA2" rx="4"/>
    <text x="162" y="57" font-size="9" text-anchor="middle" fill="white" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">sgACC</text>
    <text x="162" y="69" font-size="7" text-anchor="middle" fill="white" opacity="0.8" font-family="Helvetica Neue, Arial, sans-serif">Seed ROI</text>
    
    <!-- Arrow 2 -->
    <line x1="205" y1="60" x2="225" y2="60" stroke="#212121" stroke-width="1.5"/>
    <polygon points="230,60 223,56 223,64" fill="#212121"/>
    
    <!-- FC Computation -->
    <rect x="235" y="42" width="75" height="35" fill="#00695C" rx="4"/>
    <text x="272" y="57" font-size="9" text-anchor="middle" fill="white" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">FC</text>
    <text x="272" y="69" font-size="7" text-anchor="middle" fill="white" opacity="0.8" font-family="Helvetica Neue, Arial, sans-serif">Correlation</text>
    
    <!-- Arrow down from FC -->
    <line x1="272" y1="82" x2="272" y2="95" stroke="#212121" stroke-width="1.5"/>
    <line x1="272" y1="95" x2="160" y2="95" stroke="#212121" stroke-width="1.5"/>
    <line x1="160" y1="95" x2="160" y2="105" stroke="#212121" stroke-width="1.5"/>
    <polygon points="160,110 156,103 164,103" fill="#212121"/>
    
    <!-- Large FC computation block -->
    <rect x="20" y="115" width="280" height="45" fill="#455A64" rx="4"/>
    <text x="160" y="132" font-size="9" text-anchor="middle" fill="white" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">Compute sgACC-centered FC</text>
    
    <!-- Three time windows -->
    <rect x="35" y="140" width="70" height="15" fill="#9E9E9E" rx="2"/>
    <text x="70" y="151" font-size="8" text-anchor="middle" fill="white" font-family="Helvetica Neue, Arial, sans-serif">Pre</text>
    
    <rect x="115" y="140" width="70" height="15" fill="#E65100" rx="2"/>
    <text x="150" y="151" font-size="8" text-anchor="middle" fill="white" font-family="Helvetica Neue, Arial, sans-serif">tFUS</text>
    
    <rect x="195" y="140" width="70" height="15" fill="#2E7D32" rx="2"/>
    <text x="230" y="151" font-size="8" text-anchor="middle" fill="white" font-family="Helvetica Neue, Arial, sans-serif">Post</text>
    
    <!-- Arrow to stats -->
    <line x1="160" y1="165" x2="160" y2="175" stroke="#212121" stroke-width="1.5"/>
    <polygon points="160,180 156,173 164,173" fill="#212121"/>
    
    <!-- Mixed Effects Model -->
    <rect x="20" y="183" width="280" height="22" fill="#37474F" rx="4"/>
    <text x="160" y="198" font-size="8" text-anchor="middle" fill="white" font-weight="500" font-family="Helvetica Neue, Arial, sans-serif">Mixed-Effects Model: time x condition (Pre to Post DiD)</text>
  </g>
  

</svg>